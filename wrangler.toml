name = "off-prompt"
main = "server/src/cloudflare/worker.ts"
compatibility_date = "2026-11-11"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/socket", "/health"]

[[durable_objects.bindings]]
name = "GAME"
class_name = "GameDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameDurableObject"]

[[previews.durable_objects.bindings]]
name = "GAME"
class_name = "GameDurableObject"
